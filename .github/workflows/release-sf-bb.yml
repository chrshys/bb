name: Release sf-bb

on:
  push:
    branches:
      - sf-bb
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned and moving releases
        required: true
        type: boolean
        default: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

concurrency:
  group: release-sf-bb
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::pnpm install failed on attempt $attempt; retrying"
            sleep $((attempt * 5))
          done

      - name: Typecheck and test release source
        run: |
          set +e
          pnpm exec turbo run typecheck --output-logs=new-only > "$RUNNER_TEMP/typecheck.txt" 2>&1
          TYPECHECK_EXIT=$?
          pnpm exec turbo run test --filter=@bb/app --filter=@bb/server --filter=@bb/plugin-api-map --filter=@get-bb/plugin-sdk --filter=@bb/desktop --output-logs=new-only > "$RUNNER_TEMP/test.txt" 2>&1
          TEST_EXIT=$?
          set -e
          if [[ "$TYPECHECK_EXIT" -ne 0 ]]; then
            tail -200 "$RUNNER_TEMP/typecheck.txt"
          fi
          if [[ "$TEST_EXIT" -ne 0 ]]; then
            tail -300 "$RUNNER_TEMP/test.txt"
          fi
          if [[ "$TYPECHECK_EXIT" -ne 0 || "$TEST_EXIT" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sf-bb-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/typecheck.txt
            ${{ runner.temp }}/test.txt
          if-no-files-found: error

  build:
    name: Build Apple Silicon release
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.identity.outputs.build_date }}
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Require sf-bb branch
        run: test "$GITHUB_REF" = "refs/heads/sf-bb"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::pnpm install failed on attempt $attempt; retrying"
            sleep $((attempt * 5))
          done

      - name: Verify package version lockstep
        run: node .github/workflows/check-version-lockstep.mjs

      - name: Derive release version
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          NEXT_PATCH="$(node --input-type=module -e 'import { resolveVersionArgument } from "./scripts/lib/semver.mjs"; process.stdout.write(resolveVersionArgument({ argument: "--patch", currentVersion: process.argv[1], usage: "" }));' "$BASE_VERSION")"
          VERSION="${NEXT_PATCH}-sf.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-sf-bb/desktop-version.json"
          PUBLISHED_FEED="$RUNNER_TEMP/published-desktop-version.json"
          HTTP_STATUS="$(curl --silent --show-error --location --retry 5 --retry-all-errors --output "$PUBLISHED_FEED" --write-out '%{http_code}' "$FEED_URL")"
          if [[ "$HTTP_STATUS" == "200" ]]; then
            PUBLISHED_VERSION="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (typeof value.version !== "string") { throw new Error("Published feed has no version"); } process.stdout.write(value.version);' "$PUBLISHED_FEED")"
            node --input-type=module -e 'import { compareSemver } from "./scripts/lib/semver.mjs"; if (compareSemver(process.argv[1], process.argv[2]) <= 0) { console.error(`Release version ${process.argv[1]} must be newer than published version ${process.argv[2]}.`); process.exit(1); }' "$VERSION" "$PUBLISHED_VERSION"
            git fetch --force origin refs/tags/desktop-sf-bb:refs/tags/desktop-sf-bb
            PUBLISHED_SHA="$(git rev-parse 'refs/tags/desktop-sf-bb^{commit}')"
            if ! git merge-base --is-ancestor "$PUBLISHED_SHA" "$GITHUB_SHA"; then
              echo "Published commit $PUBLISHED_SHA is not an ancestor of $GITHUB_SHA." >&2
              exit 1
            fi
          elif [[ "$HTTP_STATUS" != "404" ]]; then
            echo "Could not read the published feed: HTTP $HTTP_STATUS" >&2
            exit 1
          fi
          node scripts/bump-version.mjs "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve build identity
        id: identity
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "BB_DESKTOP_BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "BB_DESKTOP_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Validate signing configuration
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VALUES=(
            "$MACOS_CERTIFICATE_P12"
            "$MACOS_CERTIFICATE_PASSWORD"
            "$APPLE_ID"
            "$APPLE_APP_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          PRESENT=0
          for value in "${VALUES[@]}"; do
            if [[ -n "$value" ]]; then
              PRESENT=$((PRESENT + 1))
            fi
          done
          if [[ "$PRESENT" -eq 0 ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [[ "$PRESENT" -eq "${#VALUES[@]}" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "The macOS signing secret set is incomplete." >&2
            exit 1
          fi

      - name: Build signed release
        if: steps.signing.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BB_DESKTOP_CUSTOM_AUTO_UPDATE: "1"
          BB_DESKTOP_RELEASE_CHANNEL: custom
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: pnpm exec turbo run desktop:build --filter=@bb/desktop --force --output-logs=new-only

      - name: Build ad-hoc release
        if: steps.signing.outputs.signed == 'false'
        env:
          BB_DESKTOP_ADHOC_SIGNING: "true"
          BB_DESKTOP_CUSTOM_AUTO_UPDATE: "0"
          BB_DESKTOP_RELEASE_CHANNEL: custom
        run: pnpm exec turbo run desktop:build --filter=@bb/desktop --force --output-logs=new-only

      - name: Smoke test packaged app
        env:
          BB_DESKTOP_RELEASE_CHANNEL: custom
        run: pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only

      - name: Generate version feed
        env:
          BB_DESKTOP_RELEASE_CHANNEL: custom
        run: pnpm --dir apps/desktop run desktop:version-feed

      - name: Generate build identity
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e 'const fs = require("node:fs"); const value = { version: process.env.VERSION, commit: process.env.BB_DESKTOP_COMMIT, buildDate: process.env.BB_DESKTOP_BUILD_DATE, runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`, channel: "custom" }; fs.writeFileSync("apps/desktop/release/build-info.json", `${JSON.stringify(value, null, 2)}\n`);'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sf-bb-${{ steps.version.outputs.version }}-macos-arm64
          retention-days: 14
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/custom-mac.yml
            apps/desktop/release/desktop-version.json
            apps/desktop/release/build-info.json
          if-no-files-found: error

      - name: Summarize build
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "## sf-bb build"
            echo
            echo "- Version: ${VERSION}"
            echo "- Apple Silicon macOS"
            echo "- Signed and notarized: ${SIGNED}"
            echo "- Artifact: sf-bb-${VERSION}-macos-arm64"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish verified sf-bb release
    needs:
      - build
      - validate
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BB_DESKTOP_BUILD_DATE: ${{ needs.build.outputs.build_date }}
      SIGNED: ${{ needs.build.outputs.signed }}
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sf-bb-${{ needs.build.outputs.version }}-macos-arm64
          path: apps/desktop/release

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd apps/desktop/release
          BINARY_ASSETS=(
            ./*.dmg
            ./*.zip
            ./*.blockmap
          )
          FEED_ASSETS=(
            ./build-info.json
            ./custom-mac.yml
            ./desktop-version.json
          )
          ASSETS=("${BINARY_ASSETS[@]}" "${FEED_ASSETS[@]}")
          for asset in "${ASSETS[@]}"; do
            if [[ ! -e "$asset" ]]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done
          VERSION_TAG="sf-bb-v${VERSION}"
          MOVING_TAG="desktop-sf-bb"
          if gh release view "$VERSION_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION_TAG already exists." >&2
            exit 1
          fi
          if [[ "$SIGNED" == "true" ]]; then
            RELEASE_NOTES="Signed and notarized sf-bb ${VERSION} for Apple Silicon Macs. Launch it normally from Applications. Automatic updates are enabled."
          else
            RELEASE_NOTES="Ad-hoc signed sf-bb ${VERSION} for Apple Silicon Macs. On first launch, use System Settings > Privacy & Security > Open Anyway, or run xattr -dr com.apple.quarantine /Applications/sf-bb.app. Automatic installation is disabled until Developer ID signing is configured."
          fi
          PREVIOUS_TAG="$(git describe --tags --match 'sf-bb-v*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            CHANGE_BASE="$PREVIOUS_TAG"
            CHANGE_LOG="$(git log --oneline "${PREVIOUS_TAG}..HEAD")"
          else
            CHANGE_BASE="initial"
            CHANGE_LOG="initial"
          fi
          RELEASE_NOTES="$(printf '%s\n\nCommit: %s\nChanges since %s:\n%s' "$RELEASE_NOTES" "$GITHUB_SHA" "$CHANGE_BASE" "$CHANGE_LOG")"
          git tag "$VERSION_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION_TAG}"
          gh release create "$VERSION_TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "sf-bb ${VERSION}" \
            --notes "$RELEASE_NOTES" \
            --prerelease \
            --latest=false
          if gh release view "$MOVING_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$MOVING_TAG" "${BINARY_ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            git tag -f "$MOVING_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/${MOVING_TAG}"
            gh release edit "$MOVING_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sf-bb latest" \
              --notes "$RELEASE_NOTES" \
              --latest
            gh release upload "$MOVING_TAG" "${FEED_ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            while IFS= read -r asset_name; do
              KEEP_ASSET=false
              for expected_asset in "${ASSETS[@]}"; do
                if [[ "$asset_name" == "${expected_asset#./}" ]]; then
                  KEEP_ASSET=true
                  break
                fi
              done
              if [[ -n "$asset_name" && "$KEEP_ASSET" == "false" ]]; then
                gh release delete-asset "$MOVING_TAG" "$asset_name" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view "$MOVING_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            git tag -f "$MOVING_TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/${MOVING_TAG}"
            gh release create "$MOVING_TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "sf-bb latest" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi

      - name: Verify published release
        run: |
          set -euo pipefail
          FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-sf-bb/desktop-version.json"
          BUILD_INFO_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-sf-bb/build-info.json"
          FEED_FILE="$RUNNER_TEMP/published-desktop-version.json"
          BUILD_INFO_FILE="$RUNNER_TEMP/published-build-info.json"
          CACHE_BUST="cache-bust=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --retry 5 --retry-all-errors "${FEED_URL}?${CACHE_BUST}" --output "$FEED_FILE"
          curl -fsSL --retry 5 --retry-all-errors "${BUILD_INFO_URL}?${CACHE_BUST}" --output "$BUILD_INFO_FILE"
          ZIP_PATH="$(node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (value.version !== process.argv[2]) { throw new Error(`Published feed version ${value.version} does not match ${process.argv[2]}`); } if (typeof value.path !== "string" || value.path.length === 0) { throw new Error("Published feed has no zip path"); } process.stdout.write(value.path);' "$FEED_FILE" "$VERSION")"
          node -e 'const fs = require("node:fs"); const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); const expected = { version: process.argv[2], commit: process.env.GITHUB_SHA, buildDate: process.env.BB_DESKTOP_BUILD_DATE, runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`, channel: "custom" }; for (const [key, expectedValue] of Object.entries(expected)) { if (value[key] !== expectedValue) { throw new Error(`Published build identity ${key}=${value[key]} does not match ${expectedValue}`); } }' "$BUILD_INFO_FILE" "$VERSION"
          curl -fsIL --retry 5 --retry-all-errors "https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-sf-bb/${ZIP_PATH}"

      - name: Summarize
        run: |
          {
            echo "## sf-bb release"
            echo
            echo "- Version: ${VERSION}"
            echo "- Apple Silicon macOS"
            echo "- Signed and notarized: ${SIGNED}"
            echo "- Download: https://github.com/${GITHUB_REPOSITORY}/releases/tag/desktop-sf-bb"
          } >> "$GITHUB_STEP_SUMMARY"
