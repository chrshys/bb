name: Sync sf-bb with upstream

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the merge without pushing sf-bb
        required: true
        type: boolean
        default: false

env:
  PNPM_VERSION: "9.15.0"

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Merge and validate upstream
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Mirror upstream main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync chrshys/bb --source get-bb/bb --branch main

      - name: Checkout sf-bb
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: sf-bb

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Fetch upstream branches
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/get-bb/bb.git
          git fetch --force origin main:refs/remotes/origin/main
          git fetch --force upstream main:refs/remotes/upstream/main
          PR_STATE="$(gh pr view 2796 --repo get-bb/bb --json state --jq .state)"
          echo "pr_state=${PR_STATE}" >> "${GITHUB_OUTPUT}"
          if [[ "${PR_STATE}" == "OPEN" ]]; then
            git fetch --force upstream refs/pull/2796/head:refs/remotes/upstream/pr-2796
          fi

      - name: Report pinned pull request lifecycle
        if: steps.upstream.outputs.pr_state != 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_STATE: ${{ steps.upstream.outputs.pr_state }}
        run: |
          set -euo pipefail
          ISSUE_TITLE="PR #2796 merged upstream — drop the pinned merge from sync-upstream.yml"
          BODY_FILE="${RUNNER_TEMP}/pinned-pr-lifecycle.md"
          cat > "${BODY_FILE}" <<EOF
          ## Summary

          Upstream PR #2796 is ${PR_STATE}. The sync skipped its pull ref and merged upstream main only.

          ## Expected follow-up

          Remove the pinned PR fetch and merge from .github/workflows/sync-upstream.yml, then update docs/sf-bb-release-process.md.

          ## Evidence

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Upstream PR: https://github.com/get-bb/bb/pull/2796

          > AGENT GENERATED
          EOF
          EXISTING_ISSUE="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${ISSUE_TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${EXISTING_ISSUE}" ]]; then
            gh issue comment "${EXISTING_ISSUE}" --repo "${GITHUB_REPOSITORY}" --body-file "${BODY_FILE}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${ISSUE_TITLE}" --body-file "${BODY_FILE}"
          fi

      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
          PR_STATE: ${{ steps.upstream.outputs.pr_state }}
        run: |
          set -euo pipefail

          create_or_update_issue() {
            local issue_title="${1:?issue title is required}"
            local body_file="${2:?issue body file is required}"
            local existing_issue
            existing_issue="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${issue_title} in:title" --json number --jq '.[0].number // empty')"
            if [[ -n "${existing_issue}" ]]; then
              gh issue comment "${existing_issue}" --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${issue_title}" --body-file "${body_file}"
            fi
          }

          merge_source() {
            local source_ref="${1:?source ref is required}"
            local source_label="${2:?source label is required}"
            local base_sha incoming_sha conflict_list issue_date issue_title body_file
            local only_inventory only_lockfile path
            local -a conflicted_paths

            base_sha="$(git rev-parse HEAD)"
            incoming_sha="$(git rev-parse "${source_ref}")"
            if git merge --no-edit "${source_ref}"; then
              return 0
            fi

            mapfile -t conflicted_paths < <(git diff --name-only --diff-filter=U)
            if (( ${#conflicted_paths[@]} == 0 )); then
              git merge --abort 2>/dev/null || true
              echo "Merge of ${source_ref} failed without conflicted paths." >&2
              return 1
            fi

            only_inventory=true
            only_lockfile=true
            for path in "${conflicted_paths[@]}"; do
              if [[ "${path}" != "packages/plugin-api-map/sdk-public-api.json" && "${path}" != packages/plugin-api-map/src/generated/* ]]; then
                only_inventory=false
              fi
              if [[ "${path}" != "pnpm-lock.yaml" ]]; then
                only_lockfile=false
              fi
            done

            if [[ "${only_inventory}" == "true" ]]; then
              pnpm install --frozen-lockfile --prefer-offline
              pnpm exec turbo run update:sdk-inventory --filter=@bb/plugin-api-map --output-logs=new-only
              git add -- "${conflicted_paths[@]}"
              git commit --no-edit
              return 0
            fi

            if [[ "${only_lockfile}" == "true" ]]; then
              git checkout --theirs pnpm-lock.yaml
              pnpm install --lockfile-only
              git add pnpm-lock.yaml
              git commit --no-edit
              return 0
            fi

            conflict_list="$(printf -- '- %s\n' "${conflicted_paths[@]}")"
            git merge --abort
            issue_date="$(date -u +%Y-%m-%d)"
            issue_title="Upstream sync conflict ${issue_date}"
            body_file="${RUNNER_TEMP}/sync-conflict.md"
            cat > "${body_file}" <<EOF
          ## Summary

          The automated sf-bb merge stopped on source conflicts while merging ${source_label}.

          ## Versions

          - sf-bb merge base: ${base_sha}
          - Incoming ${source_label}: ${incoming_sha}

          ## Reproduction

          Run the sync-upstream workflow against sf-bb. The merge command is git merge --no-edit ${source_ref}.

          ## Expected

          The source merges cleanly, or only the generated Plugin SDK inventory or pnpm-lock.yaml requires automatic regeneration.

          ## Actual

          Conflicted paths:

          ${conflict_list}

          ## Manual recovery

              gh repo sync chrshys/bb --source get-bb/bb --branch main
              git fetch origin main sf-bb
              git fetch upstream main refs/pull/2796/head:refs/remotes/upstream/pr-2796
              git switch sf-bb
              git merge --no-edit upstream/pr-2796
              git merge --no-edit origin/main
              pnpm install --frozen-lockfile
              pnpm exec turbo run typecheck
              git push origin sf-bb

          ## Evidence

          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          > AGENT GENERATED
          EOF
            create_or_update_issue "${issue_title}" "${body_file}"
            return 1
          }

          if [[ "${PR_STATE}" == "OPEN" ]]; then
            merge_source upstream/pr-2796 "upstream PR #2796"
          fi
          merge_source upstream/main "get-bb/bb main"

      - name: Install merged dependencies
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile --prefer-offline; then
              exit 0
            fi
            if [ "${attempt}" -eq 3 ]; then
              exit 1
            fi
            echo "::warning::pnpm install failed on attempt ${attempt}; retrying"
            sleep $((attempt * 5))
          done

      - name: Validate merged source
        run: |
          set +e
          pnpm exec turbo run typecheck --output-logs=new-only > "${RUNNER_TEMP}/typecheck.txt" 2>&1
          TYPECHECK_EXIT=$?
          xvfb-run -a pnpm exec turbo run test --filter=@bb/server --filter=@bb/plugin-api-map --filter=@bb/desktop --output-logs=new-only > "${RUNNER_TEMP}/test.txt" 2>&1
          TEST_EXIT=$?
          set -e
          if [[ "${TYPECHECK_EXIT}" -ne 0 ]]; then
            tail -200 "${RUNNER_TEMP}/typecheck.txt"
          fi
          if [[ "${TEST_EXIT}" -ne 0 ]]; then
            tail -300 "${RUNNER_TEMP}/test.txt"
          fi
          if [[ "${TYPECHECK_EXIT}" -ne 0 || "${TEST_EXIT}" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sf-bb-sync-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/typecheck.txt
            ${{ runner.temp }}/test.txt
          if-no-files-found: ignore

      - name: Show dry-run result
        if: inputs.dry_run == true
        run: |
          PENDING_COMMITS="$(git log --oneline origin/sf-bb..HEAD)"
          if [[ -n "${PENDING_COMMITS}" ]]; then
            printf '%s\n' "${PENDING_COMMITS}"
          else
            echo "No pending sf-bb commits."
          fi

      - name: Push sf-bb
        if: inputs.dry_run == false
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          : "${SYNC_TOKEN:?SYNC_TOKEN is required for a real sync}"
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:sf-bb
